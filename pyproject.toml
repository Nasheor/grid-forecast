[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grid-forecast"
version = "0.1.0"
description = "Day-ahead demand, wind and price forecasts on one year of public Irish grid and market data, walk-forward, served by FastAPI with MLflow"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Avinash Nagarajan" }]
dependencies = [
  "pandas==3.1.0",
  "numpy==2.5.4",
  "pyarrow==25.0.1",
  "duckdb==2.0.0",
  "lightgbm==4.7.0",
  "torch==2.15.0",
  "scikit-learn==1.9.1",
  "mlflow==3.17.2",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "holidays==0.107",
  "matplotlib==3.11.2",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
